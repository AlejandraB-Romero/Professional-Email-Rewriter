<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change E-mail | Professional Rewriter</title>
  
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div id="toastContainer" class="toast-container"></div>

  <div class="app-container">
    <!-- Barra Superior -->
    <div class="top-header">
      <button id="themeToggleBtn" class="theme-toggle-btn">
        <span id="themeIcon">🌙</span>
        <span id="themeText">Modo Oscuro</span>
      </button>
      <div class="brand-version">
        <img src="assets/img/logo.png" alt="Logo">
        <span class="brand-name">Professional Email Rewriter</span>
        <span id="appVersionTag" class="version-tag">v1.0.0</span>
      </div>
    </div>

    <!-- Header Principal -->
    <header>
      <h1>Change E-mail</h1>
      <p>Redacción e-mail profesional impulsada por tu IA Local</p>
      <!-- Estado dinámico (Healthcheck) -->
      <div id="healthBadge" class="status-badge offline">
        <span id="healthDot">🟡</span> <span id="healthText">Comprobando Ollama...</span>
      </div>
    </header>

    <main class="card">
      <div class="section-header">
        <label for="userEmail">Borrador de entrada:</label>
        <div class="top-actions">
          <button id="pasteBtn" class="btn-secondary">📋 Pegar</button>
        </div>
      </div>

      <textarea id="userEmail" placeholder="Escribe tu texto borrador aquí... Ej: ola jefe mañan no voy xk toy enfermo me pasas las notas..."></textarea>

      <div class="form-group">
        <label for="toneSelect">Selecciona el tono del correo:</label>
        <select id="toneSelect" class="tone-select">
          <option value="profesional">🏢 Profesional / Ejecutivo</option>
          <option value="casual">😊 Casual / Cercano</option>
          <option value="comercial">💼 Comercial / Ventas</option>
          <option value="legal">⚖️ Legal / Formal</option>
          <option value="academico">🎓 Académico / Universitario</option>
          <option value="soporte">🛠️ Soporte Técnico</option>
        </select>
      </div>

      <button id="transformBtn" class="btn-primary">
        <span id="btnText">🦙 Transformar con IA Local</span>
        <div id="btnSpinner" class="spinner hidden"></div>
      </button>

      <div id="resultContainer" class="result-container">
        <div class="result-header">
          <h3>Resultado Mejorado</h3>
          <button id="copyBtn" class="btn-secondary" disabled>📄 Copiar</button>
        </div>

        <div id="pdfArea">
          <div id="resultContent" class="result-content placeholder">Escribe un borrador arriba y pulsa "Transformar con IA Local"...</div>
        </div>

        <!-- Nuevo Panel de Información / Métricas -->
        <div id="statsPanel" class="stats-panel hidden">
          <div class="stat-item"><span>Modelo:</span> <strong id="statModel">-</strong></div>
          <div class="stat-item"><span>Tiempo:</span> <strong id="statTime">0.0s</strong></div>
          <div class="stat-item"><span>Caracteres:</span> <strong id="statChars">0</strong></div>
          <div class="stat-item"><span>Palabras:</span> <strong id="statWords">0</strong></div>
        </div>

        <button id="downloadPdfBtn" class="btn-pdf" disabled>📥 Descargar en PDF</button>
      </div>
    </main>
  </div>

  <!-- Entrada del módulo ES6 -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
